name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    # Disabled while private; preserve the event condition for future review.
    if: ${{ false && github.event_name == 'pull_request' }}
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run sync:check
      - run: npm run build
      - run: npm run test:docs
      - run: npm run test:unit

  integration:
    # Disabled while private; preserve the event condition for future review.
    if: ${{ false && github.event_name != 'pull_request' }}
    name: Full integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: npm run sync:check
      - run: npm run build
      - run: npm run test:docs
      - run: npm test
      - run: npm run test:rename
      - run: npm run test:external
      - run: npm pack --dry-run --json
      - run: npm pack ./packages/create --dry-run --json

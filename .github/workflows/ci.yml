name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portability:
    name: Node 22 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check generated files
        run: npm run sync:check
      - name: Build
        run: npm run build
      - name: Check documentation
        run: npm run test:docs
      - name: Run platform-neutral tests
        run: npm run test:unit
      - name: Inspect package contents
        run: |
          npm pack --dry-run --json
          npm pack ./packages/create --dry-run --json

  supported-node:
    name: Node ${{ matrix.node }} / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Run platform-neutral tests
        run: npm run test:unit

  integration:
    name: Firefox and package integration / Linux / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install isolated pnpm verification CLI
        run: npm install --prefix .tools/pnpm-tool --ignore-scripts --no-audit --no-fund pnpm@10.34.9
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Install Firefox
        run: npm exec -- playwright install --with-deps firefox
      - name: Check generated files
        run: npm run sync:check
      - name: Build
        run: npm run build
      - name: Check documentation
        run: npm run test:docs
      - name: Run full test suite
        run: npm test
      - name: Check configurable identity
        run: npm run test:rename
      - name: Verify external npm package application
        run: npm run test:external -- --manager npm
      - name: Verify external pnpm package application
        run: npm run test:external -- --manager pnpm
      - name: Inspect package contents
        run: |
          npm pack --dry-run --json
          npm pack ./packages/create --dry-run --json

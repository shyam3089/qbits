<form class="registration" qb-form="signup" aria-labelledby="registration-title">
  <h2 id="registration-title">Create account</h2>
  <label for="registration-email">Email</label>
  <input id="registration-email" type="email" autocomplete="email" qb-field="email">
  <label for="registration-username">Username</label>
  <input id="registration-username" autocomplete="username" qb-field="username">
  <label for="registration-password">Password</label>
  <input id="registration-password" type="password" autocomplete="new-password" qb-field="password">
  <label for="registration-confirm-password">Confirm password</label>
  <input id="registration-confirm-password" type="password" autocomplete="new-password" qb-field="confirmPassword">
  <label for="registration-newsletter">Newsletter</label>
  <input id="registration-newsletter" type="checkbox" qb-field="newsletter">
  <button type="submit">Register</button>
  <button type="reset">Reset</button>
</form>
